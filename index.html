<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fpga-website</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <p>Engenharia de Computadores e Telemática · Universidade de Aveiro</p>
    <p>Experiências com a Cyclone IV. Mais uma tarde de VHDL.</p>
    <div class="board">
      <img src="assets/fpga.png" alt="Placa FPGA Alinx Cyclone IV com seis displays de sete segmentos" draggable="false">
      <svg id="display" viewBox="0 0 1109 859" aria-hidden="true">
        <rect x="621" y="640" width="324" height="86" fill="#202024" />
      </svg>
      <button id="hardwarePower" type="button" aria-label="Ligar FPGA" aria-pressed="false" title="ON / OFF"></button>
    </div>
    <p>
      <button id="powerButton" type="button" aria-pressed="false">Ligar FPGA</button>
      <span id="stateText" role="status">POWER = 0</span>
    </p>
  </main>
</body>
</html>
